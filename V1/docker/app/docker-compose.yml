services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: community-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    expose:
      - "8080"
    env_file:
      - ./back.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - app_net

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:latest}
    container_name: community-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
    env_file:
      - ./alloy.env
    environment:
      ALLOY_SPRING_TARGET: ${ALLOY_SPRING_TARGET:-backend:8080}
      ALLOY_INSTANCE: ${ALLOY_INSTANCE:-community-backend}
      PROM_REMOTE_WRITE_URL: ${PROM_REMOTE_WRITE_URL}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
    name: community-app-net
