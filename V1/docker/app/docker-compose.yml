services:
  nginx:
    build:
      context: ./nginx
    image: community-nginx:latest
    container_name: community-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
      FRONTEND_HOST: frontend
      FRONTEND_PORT: "3000"
      TLS_SERVER_NAME: ${CERTBOT_PRIMARY_DOMAIN:-localhost}
      ACME_WEBROOT: /var/www/certbot
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/selfsigned/fullchain.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/selfsigned/privkey.pem}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - app_net

  certbot:
    image: certbot/certbot:latest
    container_name: community-certbot
    profiles:
      - ssl
    depends_on:
      - nginx
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_DOMAINS: ${CERTBOT_DOMAINS:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-false}
      CERTBOT_MODE: ${CERTBOT_MODE:-issue}
      WEBROOT_PATH: /var/www/certbot
    volumes:
      - ./nginx/certbot-entrypoint.sh:/usr/local/bin/certbot-entrypoint.sh:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: ["sh", "/usr/local/bin/certbot-entrypoint.sh"]
    restart: "no"
    networks:
      - app_net

  backend:
    image: ${BACKEND_IMAGE}
    container_name: community-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    expose:
      - "8080"
    env_file:
      - ./backend.env
    networks:
      - app_net

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: community-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    expose:
      - "3000"
    env_file:
      - ./frontend.env
    networks:
      - app_net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: community-app-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    expose:
      - "9100"
    volumes:
      - /:/host:ro,rslave
    networks:
      - app_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: community-app-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - app_net

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: community-alloy
    restart: unless-stopped
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    env_file:
      - ./alloy.env
    expose:
      - "12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - backend
      - node-exporter
      - cadvisor
    networks:
      - app_net

networks:
  app_net:
    name: community-app-net

volumes:
  alloy_data:
  certbot_www:
  certbot_certs:
